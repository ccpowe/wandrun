# One real create_schedule call and one real clock trigger; rule combinations/CRUD live below L5.
appId: host.exp.exponent
---
# @phase schedule-create
# @open-new-chat SCHEDULE_AGENT_ID
# @open-agent-profile
- tapOn:
    id: profile-tab-schedules
# @schedule-created
- extendedWaitUntil:
    visible:
      id: profile-schedule-${AGENT_SCHEDULE_ID}
    timeout: 10000
- tapOn:
    id: profile-schedule-${AGENT_SCHEDULE_ID}
# @phase schedule-real-clock
# @schedule-triggered
# @phase schedule-source-navigation
- extendedWaitUntil:
    visible:
      id: schedule-run-${SCHEDULE_RUN_ID}
    timeout: 10000
- tapOn:
    id: schedule-run-${SCHEDULE_RUN_ID}
- extendedWaitUntil:
    visible:
      id: schedule-triggered-${SCHEDULE_TRIGGER_SEQ}
    timeout: 10000
- assertVisible: 好的
- takeScreenshot: ${ARTIFACTS}/01-real-run-source.png
# @home
