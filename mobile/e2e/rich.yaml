# Real model messages: source specs travel through /messages; no synthetic Agent events.
# Accessible chart choices use plotted-point callbacks; viewer controls exercise shared 1–8× zoom bounds.
appId: host.exp.exponent
---
- extendedWaitUntil:
    visible:
      id: agent-row-${RICH_AGENT_ID}
    timeout: 10000
- tapOn:
    id: agent-row-${RICH_AGENT_ID}
# @rich-status
- scrollUntilVisible:
