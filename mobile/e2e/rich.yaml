# Fixed scenes travel through fixture_gateway /e2e/scene and production Gateway.on_human.
# Data/UI metadata and actual PNG bytes are evidence, not a substitute for native paint review.
# Removed Status/Table/forms/Tabs/Accordion/submission assertions are covered by rich L2/L3.
# Removed repeated image entry points, all-zoom-state enumeration and dev previews are duplicate/L2/L4.
appId: host.exp.exponent
---
# @phase layout
# @rich-scroll-row
# @rich-scroll-row-gestures
# @phase charts
# @rich-line
- scrollUntilVisible:
    element:
      id: rich-line-plot
    direction: DOWN
# Directional drag uses native category geometry; the hook also proves the drawer still opens outside the plot.
# @rich-touch-line
- assertVisible:
    id: rich-chart-readout
- takeScreenshot: ${ARTIFACTS}/01-line-light.png
# Only one Appearance linkage sample: same mounted chart must repaint foreground/background.
# @dark-mode
- takeScreenshot: ${ARTIFACTS}/02-line-dark.png
# Visual review: compare 01/02; chart background/axes/series must actually repaint and remain readable.
# @light-mode
# @rich-bar
- scrollUntilVisible:
    element:
      id: rich-bar-plot
    direction: DOWN
# @rich-touch-bar
- assertVisible:
    id: rich-chart-readout
- takeScreenshot: ${ARTIFACTS}/03-bar.png
# @rich-bar-horizontal
- scrollUntilVisible:
    element:
      id: rich-bar-plot
    direction: DOWN
# @rich-touch-bar-horizontal
- assertVisible:
    id: rich-chart-readout
- takeScreenshot: ${ARTIFACTS}/03a-bar-horizontal.png
# @rich-pie
- scrollUntilVisible:
    element:
      id: rich-pie-chart
    direction: DOWN
# @rich-touch-pie
# Visual review: inspect actual colored sectors, not just legend text/readout nodes.
- takeScreenshot: ${ARTIFACTS}/04-pie.png
# @phase math
# @rich-math
- scrollUntilVisible:
    element:
      text: 物理公式
    direction: UP
# @rich-check-math
# Visual review: readable inline v=at and E_k fraction, plus a typeset block integral.
# Raw TeX, a blank WebView or only the card title is a failure.
- takeScreenshot: ${ARTIFACTS}/05-math.png
# @phase gallery
# @rich-gallery-scroll
- scrollUntilVisible:
    element:
      text: 查看图片 横滑第一张标志
    direction: DOWN
# @rich-gallery-before-swipe
- swipe:
    from:
      id: rich-gallery
    direction: LEFT
# @rich-gallery-after-swipe
- takeScreenshot: ${ARTIFACTS}/06-gallery-swiped.png
- tapOn:
    text: 查看图片 ${RICH_GALLERY_OPEN_ALT}
- extendedWaitUntil:
    visible:
      id: media-image-open
    timeout: 10000
# @rich-gallery-viewer
- takeScreenshot: ${ARTIFACTS}/07-gallery-viewer-fit.png
# @rich-gallery-pinch
# Visual review: image footprint must enlarge against 07, not only the zoom label.
- takeScreenshot: ${ARTIFACTS}/08-gallery-viewer-zoomed.png
- swipe:
    from:
      id: media-zoom-viewport
    direction: LEFT
- takeScreenshot: ${ARTIFACTS}/08a-gallery-viewer-panned.png
- back
- extendedWaitUntil:
    visible:
      id: rich-gallery
    timeout: 10000
# @phase mermaid
# @rich-mermaid
- scrollUntilVisible:
    element:
      id: rich-mermaid
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: mermaid-ready
    timeout: 15000
- tapOn:
    id: mermaid-preview-open
- extendedWaitUntil:
    visible:
      id: mermaid-ready
    timeout: 15000
- takeScreenshot: ${ARTIFACTS}/09-mermaid-fit.png
# @rich-mermaid-pinch
# Visual review: actual nodes/arrows enlarge against 09 and remain readable, not just ready/reset nodes.
- takeScreenshot: ${ARTIFACTS}/10-mermaid-zoomed.png
- swipe:
    from:
      id: mermaid-ready
    direction: LEFT
- takeScreenshot: ${ARTIFACTS}/10a-mermaid-panned.png
- back
# @phase sources
# @rich-sources
- scrollUntilVisible:
    element:
      id: rich-source-toggle
    direction: UP
- tapOn:
    id: rich-source-toggle
- scrollUntilVisible:
    element:
      text: '.*Expo 文档.*docs\.expo\.dev.*'
    direction: DOWN
- scrollUntilVisible:
    element:
      id: rich-source-toggle
    direction: UP
# @rich-source-before-swipe
- swipe:
    from:
      id: rich-source-rail
    direction: LEFT
# @rich-source-after-swipe
- takeScreenshot: ${ARTIFACTS}/11-sources-swiped.png
# Manual-only exception: user taps rich-source-${RICH_SOURCE_OPEN_INDEX}, verifies the
# selected original URL really opened in the external browser, then uses SYSTEM BACK
# to restore the same Expo Go conversation. Agent must not operate outside Expo Go.
# Parent coordinates/records the exception and resumes only after Expo Go regains focus.
# @manual rich-source-external-link
# @rich-source-returned
- tapOn:
    id: rich-source-toggle
- tapOn:
    id: rich-source-toggle
# @rich-check-sources
- takeScreenshot: ${ARTIFACTS}/12-sources-returned-interactive.png
# @home
