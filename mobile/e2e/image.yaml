# Real billable generate_image; no API-seeded attachment, retry or substitute image.
appId: host.exp.exponent
---
# @open-root IMAGE_CONVERSATION_ID
# @phase image-generation
# @image-request
- extendedWaitUntil:
    visible:
      text: "查看图片 ${IMAGE_FILE_NAME}"
    timeout: 10000
# @phase image-native-preview
- takeScreenshot: ${ARTIFACTS}/01-generated-card.png
- tapOn: "查看图片 ${IMAGE_FILE_NAME}"
- extendedWaitUntil:
    visible:
      id: media-attachment-gallery
    timeout: 30000
- takeScreenshot: ${ARTIFACTS}/02-generated-original.png
- tapOn: 返回
- assertVisible: "查看图片 ${IMAGE_FILE_NAME}"
# @home
