# Real billable generation; no API-seeded attachment or synthetic image.
appId: host.exp.exponent
---
- extendedWaitUntil:
    visible:
      id: agent-row-${IMAGE_AGENT_ID}
    timeout: 10000
- tapOn:
    id: agent-row-${IMAGE_AGENT_ID}
# @image-request
- extendedWaitUntil:
    visible:
      text: "查看图片 ${IMAGE_FILE_NAME}"
    timeout: 10000
- takeScreenshot: ${ARTIFACTS}/01-image-card-light.png
# @dark-mode
- takeScreenshot: ${ARTIFACTS}/01-image-card-dark.png
- tapOn: "查看图片 ${IMAGE_FILE_NAME}"
- extendedWaitUntil:
    visible:
      id: media-attachment-gallery
    timeout: 30000
- assertVisible:
    id: media-download
- assertVisible:
    id: media-share
- takeScreenshot: ${ARTIFACTS}/02-image-preview-dark.png
# @light-mode
- assertVisible:
    id: media-attachment-gallery
- assertVisible:
    id: media-download
- assertVisible:
    id: media-share
- takeScreenshot: ${ARTIFACTS}/02-image-preview-light.png
- tapOn: 返回
- assertVisible: "查看图片 ${IMAGE_FILE_NAME}"
- tapOn: 返回
- extendedWaitUntil:
    visible:
      id: home-search
    timeout: 10000
