# Camera/permission is an explicit, timed human subscene; the private bridge observes the App's token.
appId: host.exp.exponent
---
# @phase pairing-connection
# @open-settings
- tapOn:
    id: settings-about-connection
# @pairing-original-dev
- tapOn:
    id: connection-add
- extendedWaitUntil:
    visible:
      id: pairing-scan
    timeout: 10000
# @pairing-camera
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 10000
# @phase pairing-token-install
# @pairing-exchanged
- takeScreenshot: ${ARTIFACTS}/01-scanned-chat.png
# @open-settings
- tapOn:
    id: settings-about-connection
# @pairing-fixture-current
# Exactly one explicit switch, leaving the original computer intact.
- tapOn:
    id: ${PAIRING_DEV_ROW}
- tapOn:
    id: connection-switch
- extendedWaitUntil:
    visible:
      id: composer-input
    timeout: 10000
# @phase pairing-revoke
# @open-settings
- tapOn:
    id: settings-about-connection
# @pairing-dev-current
- tapOn:
    id: ${PAIRING_FIXTURE_ROW}
# @pairing-fixture-selected
- tapOn:
    id: connection-disconnect
- tapOn:
    id: connection-disconnect-confirm
- extendedWaitUntil:
    notVisible:
      id: connection-disconnect-confirm
    timeout: 10000
# Local completion is the row disappearing; remote best-effort revocation has its own bound.
# @pairing-local-disconnected
# @pairing-revoked
# @pairing-restore-dev
- takeScreenshot: ${ARTIFACTS}/02-restored-development.png
