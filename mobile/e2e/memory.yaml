# agent-device 0.21.16 Maestro subset; run via python3 mobile/e2e/run.py memory.
# Temporary Agents and the shared-profile test marker are restored by the runner.
appId: host.exp.exponent
---
- tapOn:
    id: agent-row-${MEMORY_AGENT_ID}
- tapOn:
    id: chat-agent-profile
- tapOn:
    id: profile-tab-memory
- extendedWaitUntil:
    visible:
      id: profile-empty-memory
    timeout: 10000
- assertVisible:
    id: profile-about-you
- assertNotVisible:
    id: profile-shared-memory-content
- takeScreenshot: ${ARTIFACTS}/01-work-memory-light.png
# @dark-mode
- takeScreenshot: ${ARTIFACTS}/01-work-memory-dark.png
# @light-mode
- tapOn:
    id: profile-memory-edit
- extendedWaitUntil:
    visible:
      id: memory-editor-input
    timeout: 10000
- tapOn:
    id: memory-editor-input
- inputText: ${MEMORY_SAVED}
- back
- tapOn:
    id: memory-editor-save
# @memory-ui-saved
- extendedWaitUntil:
    visible:
      id: profile-memory-content
    timeout: 10000
- assertVisible: ${MEMORY_SAVED_TEXT}
# @memory-profile-shared
- tapOn:
    id: profile-about-you
- extendedWaitUntil:
    visible: ${MEMORY_PROFILE_TEXT}
    timeout: 10000
- takeScreenshot: ${ARTIFACTS}/02-about-you-light.png
# @dark-mode
- takeScreenshot: ${ARTIFACTS}/02-about-you-dark.png
# @light-mode
- tapOn:
    id: about-you-back
- tapOn:
    id: profile-memory-edit
- tapOn:
    id: memory-editor-new-detail
- extendedWaitUntil:
    visible:
      id: memory-detail-slug
    timeout: 10000
- tapOn:
    id: memory-detail-slug
- inputText: ${MEMORY_DETAIL_SLUG}
- back
- tapOn:
    id: memory-detail-input
- inputText: ${MEMORY_DETAIL_CONTENT}
- back
- assertVisible:
    id: memory-detail-count
- tapOn:
    id: memory-detail-save
# @memory-detail-created
- extendedWaitUntil:
    visible:
      id: memory-editor-input
    timeout: 10000
- tapOn:
    id: memory-editor-back
- extendedWaitUntil:
    visible:
      id: memory-index-detail-${MEMORY_DETAIL_SLUG}
    timeout: 10000
- tapOn:
    id: memory-index-detail-${MEMORY_DETAIL_SLUG}
- extendedWaitUntil:
    visible:
      id: memory-detail-content
    timeout: 10000
- assertVisible: ${MEMORY_DETAIL_CONTENT}
- takeScreenshot: ${ARTIFACTS}/03-detail-light.png
# @dark-mode
- takeScreenshot: ${ARTIFACTS}/03-detail-dark.png
# @light-mode
- tapOn:
    id: memory-detail-edit
- tapOn:
    id: memory-detail-input
# @select-all
- inputText: ${MEMORY_DETAIL_DRAFT}
- back
# @memory-detail-conflict
- extendedWaitUntil:
    visible:
      id: memory-detail-conflict
    timeout: 10000
# @memory-detail-draft-retained
- tapOn:
    id: memory-detail-reload
- extendedWaitUntil:
    notVisible:
      id: memory-detail-conflict
    timeout: 10000
# @memory-detail-draft-retained
- tapOn:
    id: memory-detail-save
# @memory-detail-saved
- tapOn:
    id: memory-index-detail-${MEMORY_DETAIL_SLUG}
- tapOn:
    id: memory-detail-delete
- scrollUntilVisible:
    element:
      id: memory-detail-base-index
    direction: DOWN
- assertVisible:
    id: memory-detail-base-index
- scrollUntilVisible:
    element:
      id: memory-detail-delete-index
    direction: DOWN
- assertVisible:
    id: memory-detail-delete-index
- scrollUntilVisible:
    element:
      id: memory-detail-delete-confirm
    direction: DOWN
- tapOn:
    id: memory-detail-delete-confirm
- tapOn: 删除
- extendedWaitUntil:
    visible:
      id: profile-memory-content
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: memory-index-detail-${MEMORY_DETAIL_SLUG}
    timeout: 10000
# @memory-detail-deleted
- tapOn:
    id: profile-about-you
- tapOn:
    id: profile-shared-memory-edit
- extendedWaitUntil:
    visible:
      id: memory-editor-input
    timeout: 10000
- takeScreenshot: ${ARTIFACTS}/04-about-you-editor-light.png
- tapOn:
    id: memory-editor-back
- tapOn:
    id: about-you-back
- tapOn:
    id: profile-close
- tapOn: 返回
- tapOn: 设置
- extendedWaitUntil:
    visible:
      id: settings-about-you
    timeout: 10000
- takeScreenshot: ${ARTIFACTS}/05-settings-about-you-light.png
- tapOn:
    id: settings-about-you
- extendedWaitUntil:
    visible: ${MEMORY_PROFILE_TEXT}
    timeout: 10000
- tapOn:
    id: about-you-back
- tapOn:
    id: settings-back
# @memory-shared-cross-agent
# @memory-member-link
