# Real model/browser skill opens one controlled page; this run owns the lease and HTTP fixture.
# Shared close outcomes and URL/pages combinations are covered by real Router L2; native steps cover pixels/input/layout.
# Skia/thumbnail screenshots require visual review of the actual fixture, not frame marker presence.
appId: host.exp.exponent
---
# @phase thumbnail-and-watch
# @open-root BROWSER_CONVERSATION_ID
- extendedWaitUntil:
    visible:
      id: browser-thumbnail-displayed-${BROWSER_TASK_ID}
    timeout: 20000
- takeScreenshot: ${ARTIFACTS}/01-chat-browser-thumbnail.png
- tapOn:
    id: browser-watch-${BROWSER_TASK_ID}
- extendedWaitUntil:
    visible:
      id: viewer-frame
    timeout: 10000
# Visual review: actual title BROWSER_TITLE, button, drag tile and input must be visible in Skia.
- takeScreenshot: ${ARTIFACTS}/02-viewer-skia.png
# @dark-mode
- takeScreenshot: ${ARTIFACTS}/02-viewer-skia-dark.png
# @phase native-pointer-and-input
- tapOn:
    id: viewer-takeover
- extendedWaitUntil:
    visible:
      id: takeover-frame
    timeout: 10000
# @browser-native-taken-over
# Native coordinates are only for remote controls inside Skia (no AX child nodes).
# Frame marker + measured mouse buttons/wheel recover production canvas bounds;
# page viewport/control rects determine the fitted frame, with no fixed device coordinates.
# Native mouse probe reports its real remote cursor before aiming; trusted click/focus
# and an >=80 CSS px remote drag/actual tile movement must reach HTTP.
# @browser-native-pointer
- takeScreenshot: ${ARTIFACTS}/03-takeover-pointer-result.png
- tapOn:
    id: takeover-keyboard
- extendedWaitUntil:
    visible:
      id: takeover-key-Tab
    timeout: 10000
- inputText: ${BROWSER_INPUT}
# @browser-native-input
- takeScreenshot: ${ARTIFACTS}/04-phone-ime-remote-input.png
- tapOn:
    id: takeover-keyboard-hide
# @browser-native-scroll
# @phase native-layout-and-back
- tapOn:
    id: takeover-more
- tapOn:
    id: takeover-landscape
# Landscape B is up (control column mounted) and the More sheet has closed (its switch is gone).
- extendedWaitUntil:
    visible:
      id: takeover-control-column
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: takeover-landscape
    timeout: 10000
# @browser-native-landscape
# Visual review: landscape B — wheel column at far left, handback / buttons / dock in the right column, picture between.
- takeScreenshot: ${ARTIFACTS}/05-landscape-controls.png
# Actual Android Back leaves control for the retained viewer; do not depend on the unmerged P8 flow.
- back
- extendedWaitUntil:
    visible:
      id: viewer-frame
    timeout: 10000
- tapOn:
    id: viewer-takeover
- extendedWaitUntil:
    visible:
      id: takeover-url
    timeout: 10000
# @browser-native-portrait
- takeScreenshot: ${ARTIFACTS}/06-portrait-controls-after-system-back.png
# @phase handback-and-native-close
- tapOn:
    id: takeover-handback
# @browser-native-handed-back
- scrollUntilVisible:
    element:
      id: takeover-ended-${TAKEOVER_SEQ}
    direction: DOWN
- takeScreenshot: ${ARTIFACTS}/07-handed-back.png
# @light-mode
# @phase profile-browser-thumbnail
- tapOn:
    id: chat-agent-profile
- tapOn:
    id: profile-tab-computer
- extendedWaitUntil:
    visible:
      id: browser-thumbnail-displayed-${BROWSER_TASK_ID}
    timeout: 20000
- takeScreenshot: ${ARTIFACTS}/07-profile-browser-thumbnail.png
- tapOn:
    id: profile-close
# The drawer's Computer entry owns browser resources; settings manages saved connections.
- tapOn:
    id: chat-open-drawer
- tapOn:
    id: drawer-computer
- extendedWaitUntil:
    visible:
      id: settings-computer-page-${BROWSER_TASK_ID}-${BROWSER_PAGE_ID}
    timeout: 10000
- swipe:
    from:
      id: settings-computer-page-${BROWSER_TASK_ID}-${BROWSER_PAGE_ID}
    direction: LEFT
- tapOn: 关闭此任务的全部浏览器页面
# @browser-native-closed
- extendedWaitUntil:
    notVisible:
      id: settings-computer-page-${BROWSER_TASK_ID}-${BROWSER_PAGE_ID}
    timeout: 10000
- takeScreenshot: ${ARTIFACTS}/08-native-swipe-closed.png
# @home
