plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'io.wandrun.net'
version = '1.0.0'

android {
  namespace 'io.wandrun.net'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
